global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter-host'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          scope: host

  - job_name: 'node-exporter-containers'
    file_sd_configs:
      - files:
          - /etc/prometheus/node-exporter-targets.json
        refresh_interval: 15s

  - job_name: 'execution-node-metrics'
    file_sd_configs:
      - files:
          - /etc/prometheus/execution-node-targets.json
        refresh_interval: 15s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [container_label_experiment_node_index]
        regex: '.+'
        action: keep
      - source_labels: [container_label_experiment_node_index]
        target_label: node_index
      - source_labels: [container_label_experiment_client]
        target_label: client
      - source_labels: [container_label_experiment_runtime_variant]
        target_label: runtime_variant
      - source_labels: [container_label_experiment_node_service]
        target_label: node_service
      - source_labels: [name]
        target_label: container_name
      - target_label: scope
        replacement: container

  - job_name: 'metrics-server'
    static_configs:
      - targets: ['metrics-server:9100']

# Keep the host, execution-node, and container scrape scopes distinct.

