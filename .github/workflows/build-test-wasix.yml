name: Build & Test WASIX

on:
  repository_dispatch:
    types: [trigger-wasix-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build WASIX & Run Hive Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'trigger-wasix-build' }}
    outputs:
      build-status: ${{ steps.build-status.outputs.status }}
      test-pass: ${{ steps.parse-results.outputs.pass }}
      test-fail: ${{ steps.parse-results.outputs.fail }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check existing toolchain
        id: check
        run: |
          echo "Checking if build tools are already available..."

          if ! command -v rustc &>/dev/null || ! command -v cargo &>/dev/null; then
            echo "needs_rust=true" >> $GITHUB_OUTPUT
            echo "Rust toolchain is missing"
          else
            echo "needs_rust=false" >> $GITHUB_OUTPUT
            echo "Rust toolchain is already installed"
          fi

          if ! command -v wasixcc &>/dev/null; then
            echo "needs_wasixcc=true" >> $GITHUB_OUTPUT
            echo "wasixcc is missing"
          else
            echo "needs_wasixcc=false" >> $GITHUB_OUTPUT
            echo "wasixcc is already installed"
          fi

          if ! command -v cargo &>/dev/null || ! cargo wasix --version &>/dev/null; then
            echo "needs_cargowasix=true" >> $GITHUB_OUTPUT
            echo "cargo-wasix is missing"
          else
            echo "needs_cargowasix=false" >> $GITHUB_OUTPUT
            echo "cargo-wasix is already installed"
          fi

          if ! command -v lld &>/dev/null && ! command -v ld.lld &>/dev/null; then
            echo "needs_lld=true" >> $GITHUB_OUTPUT
            echo "lld is missing"
          else
            echo "needs_lld=false" >> $GITHUB_OUTPUT
            echo "lld is already installed"
          fi

      - name: Set up Rust toolchain
        if: steps.check.outputs.needs_rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up wasixcc (C/C++ toolchain & sysroot)
        if: steps.check.outputs.needs_wasixcc == 'true'
        uses: wasix-org/wasixcc@v0.4.7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        if: steps.check.outputs.needs_lld == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Set up cargo-wasix
        if: steps.check.outputs.needs_cargowasix == 'true'
        uses: wasix-org/cargo-wasix@v0.1.34
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasix_eth -> target

      - name: Build WASIX release binary
        run: |
          cd wasix_eth
          cargo wasix build --release

      - name: Verify build artifact
        id: build-status
        run: |
          test -f wasix_eth/target/wasm32-wasmer-wasi/release/wasix_eth.wasi.wasm || (echo "WASIX binary wasix_eth.wasi.wasm not found!" && exit 1)
          ls -la wasix_eth/target/wasm32-wasmer-wasi/release/wasix_eth.wasi.wasm
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Build WASIX client Docker image
        run: |
          docker build -t z4l3s5i0/wasix-eth-wasix:latest -f wasix_eth/Dockerfile.wasix wasix_eth

      - name: Build Hive test runner image
        run: |
          docker build -t hive-custom -f hive/hive.dockerfile .

      - name: Run Hive engine simulation - wasix-w-eth (WASIX)
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/workspace:/hive/workspace \
            hive-custom \
            --sim ethereum/engine \
            --client wasix-w-eth \
            --sim.parallelism 20 \
            --docker.pull=false

      - name: Parse test results
        id: parse-results
        if: always()
        run: |
          pass=0
          fail=0
          for f in workspace/logs/*.json; do
            if [ -f "$f" ]; then
              p=$(grep -o '"pass":true' "$f" | wc -l)
              f_count=$(grep -o '"pass":false' "$f" | wc -l)
              pass=$((pass + p))
              fail=$((fail + f_count))
            fi
          done
          echo "pass=$pass" >> $GITHUB_OUTPUT
          echo "fail=$fail" >> $GITHUB_OUTPUT
          echo "wasix-w-eth: $pass passed, $fail failed"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-test-logs-wasix-w-eth
          path: workspace/logs
          retention-days: 30

      - name: Fix workspace logs permissions
        if: always()
        run: |
          chmod -R +w workspace/logs 2>/dev/null || true

      - name: Generate build status badge
        if: always()
        continue-on-error: true
        uses: peterrhodesdev/build-a-badge@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: wasix-build-status
          label: WASIX Build
          message: ${{ steps.build-status.outputs.status }}
          color: ${{ steps.build-status.outputs.status == 'success' && 'green' || 'red' }}

      - name: Generate test status badge
        if: always()
        continue-on-error: true
        uses: peterrhodesdev/build-a-badge@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: wasix-w-eth-tests
          label: wasix-w-eth
          message: ${{ steps.parse-results.outputs.pass }}✓ ${{ steps.parse-results.outputs.fail }}✗
          color: ${{ steps.parse-results.outputs.fail == '0' && 'green' || 'orange' }}

  trigger-cleanup:
    name: Trigger Cleanup
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Trigger Cleanup Workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-cleanup
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
