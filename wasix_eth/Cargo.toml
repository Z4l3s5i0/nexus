[workspace]
members = [
    "wasix_eth_rpc",
    "wasix_eth_storage",
    "wasix_eth_types",
    "wasix_eth_execution",
    "wasix_eth_p2p",
    "wasix_eth_app",
    "wasix_eth_utils",
    "wasix_eth_core",
    "testing",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Z4l3s5i0"]

[workspace.lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }

[profile.release]
#panic = "abort"
#lto = true
#codegen-units = 1

[workspace.dependencies]
wasix_eth_app = { path = "wasix_eth_app", version = "0.1.0" }
wasix_eth_utils = { path = "wasix_eth_utils", version = "0.1.0" }
wasix_eth_rpc = { path = "wasix_eth_rpc", version = "0.1.0" }
wasix_eth_storage = { path = "wasix_eth_storage", version = "0.1.0" }
wasix_eth_types = { path = "wasix_eth_types", version = "0.1.0" }
wasix_eth_execution = { path = "wasix_eth_execution", version = "0.1.0" }
wasix_eth_p2p = { path = "wasix_eth_p2p", version = "0.1.0" }
wasix_eth_core = { path = "wasix_eth_core", version = "0.1.0" }


alloy-rlp = { version = "=0.3.16" }
alloy-consensus = { version = "=2.5.0" }
alloy-network = { version = "=2.5.0" }
alloy-rpc-types = { version = "=2.5.0", default-features = true, features = ["engine", "eth", "admin", "txpool"]}
alloy-signer = { version = "=2.5.0" }
alloy-signer-local = { version = "=2.5.0" }
alloy-primitives = { version = "=1.7.3" }
alloy-json-rpc= { version = "=2.5.0" }
alloy-serde= { version = "=2.5.0" }
alloy-eips = { version = "=2.5.0" }
alloy-trie = { version = "=0.9.8" }
alloy-genesis = {version = "=2.5.0"}
alloy-tx-macros = {version = "=2.5.0"}
anyhow = { version = "1.0.104" }
async-trait = { version = "0.1.92" }
jsonrpsee = { version = "0.26.1", default-features = false, features = ["tracing", "server", "jsonrpsee-proc-macros", "jsonrpsee-core", "client-core", "jsonrpsee-types"]}
serde_json = {version = "1.0.151"}
tempfile = { version = "3.27.0" }
tokio = {version = "1.47.0"}
dashmap = "7.0.0-rc2"
im = {version = "15.1.0"}

rand = {version = "0.9.5"}

evm = { version = "1.1.1" }
evm-precompile = { version = "1.0.1" }
evm-interpreter = { version = "1.1.0" }
redb = {version ="4.3.0"}
serde = "1.0.229"
thiserror = "2.0.21"
chrono = "0.4.45"
lazy_static = "1.5.1"
once_cell = "1.21.4"
prometheus = "0.14.0"
getrandom = {version = "0.4.3", default-features = false}
hex = "0.4.3"
snap = "1.1.2"
clap = "4.6.7"
http = "1.5.0"
hyper = "1.6.0"
reqwest = "0.12.22"
tower = "0.5.3"
aes = "0.8.4"
ctr = "0.9.2"
crc = "3.2.1"
quanta = { version = "0.12.6", default-features = false, features = ["default"] }
hmac = "0.12.1"
sha3 = { version = "0.10" }
sha2 = { version = "0.10" }
futures-util = "0.3.31"
base64 = "0.22.1"
k256 = { version = "0.13.1", features = ["ecdsa", "arithmetic", "ecdh"] }
